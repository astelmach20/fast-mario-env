name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      CXX: g++
      CC: gcc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y g++
      - name: Install package with test extras
        # nes-py 8.2.1 (reference emulator) is built from source with g++ and needs numpy<2;
        # gym-super-mario-bros ships the ROM used by the tests.
        # torch (CPU build) + SB3 enable the replay-buffer and SB3 adapter tests.
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ".[test,sb3]"
      - name: Show versions
        run: python -c "import numpy, nes_py, cv2, fast_mario_env; print(numpy.__version__, cv2.__version__, fast_mario_env.__version__)"
      - name: Run tests (CPU; CUDA tests skip without a GPU)
        run: python -m pytest -v -rs
